<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizza Power-Up</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>


<body>


<!-- START SCREEN -->

<div class="start-screen" id="startScreen">

<div class="start-button" onclick="startGame()"></div>

</div>


<!-- SOUNDS -->

<audio id="startSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b4c44.mp3?filename=retro-game-notification-212.wav">
</audio>

<audio id="coinSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_8a9d6e52c6.mp3?filename=coin-collect-retro-8-bit-sound-effect-145251.mp3">
</audio>



<header>

<h1>🍕 Pizza Power-Up</h1>

<p>Level Up Your Pizza & Donair Game</p>

</header>



<nav id="gameMenu">

<a href="#pizza" class="menu-option">Pizza</a>
<a href="#donair" class="menu-option">Donairs</a>
<a href="#deals" class="menu-option">Deals</a>
<a href="#order" class="menu-option">Order</a>

</nav>



<section id="pizza">

<h2>Pizza Menu</h2>

<div class="menu">

<div class="item">
<img src="images/meat-lovers.jpg">
<h3>🍖 Meat Lovers</h3>
</div>

<div class="item">
<img src="images/vegetarian.jpg">
<h3>🌱 Vegetarian</h3>
</div>

<div class="item">
<img src="images/cheese.jpg">
<h3>🧀 Cheese</h3>
</div>

<div class="item">
<img src="images/hawaiian.jpg">
<h3>🍍 Hawaiian</h3>
</div>

</div>

</section>



<section id="donair">

<h2>Donair Menu</h2>

<div class="menu">

<div class="item">
<img src="images/donair.jpg">
<h3>🔥 Power-Up Donair</h3>
</div>

<div class="item">
<img src="images/donair.jpg">
<h3>🍟 Donair Poutine</h3>
</div>

</div>

</section>



<section id="deals">

<h2>Power-Up Deals</h2>

<div class="menu">

<div class="item">Level 1 Combo</div>

<div class="item">Boss Battle</div>

<div class="item">Party Mode</div>

</div>

</section>



<section id="order">

<h2>Start Order</h2>

<button class="order-button">ORDER NOW</button>

</section>



<footer>

<p>© Pizza Power-Up</p>

</footer>



<script>


function startGame(){

document.getElementById("startSound").play()

document.getElementById("startScreen").style.display="none"

}



/* COIN SOUND */

const items = document.querySelectorAll(".item")

items.forEach(item => {

item.addEventListener("click", () => {

document.getElementById("coinSound").play()

})

})



/* GAME MENU CURSOR */

const options = document.querySelectorAll(".menu-option")

let current = 0

function updateCursor(){

options.forEach(o=>o.classList.remove("selected"))

options[current].classList.add("selected")

}

updateCursor()

document.addEventListener("keydown", e=>{

if(e.key==="ArrowRight"){

current = (current+1)%options.length

updateCursor()

}

if(e.key==="ArrowLeft"){

current = (current-1+options.length)%options.length

updateCursor()

}

})


</script>


</body>
</html>
